name: Import approved carousel images
on:
  push:
    paths:
      - 'instagram/2026-11-15_android_unused_apps_10_cards/sources.txt'
      - '.github/workflows/import-approved-carousel.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and validate the ten approved images
        shell: bash
        run: |
          set -euo pipefail
          DIR="instagram/2026-11-15_android_unused_apps_10_cards"
          COUNT=0
          while IFS= read -r URL || [ -n "$URL" ]; do
            [ -z "$URL" ] && continue
            COUNT=$((COUNT + 1))
            TARGET=$(printf "%s/%02d_cifrohelp_android_apps.jpg" "$DIR" "$COUNT")
            curl --fail --location --retry 3 --max-time 60 --silent --show-error "$URL" -o "$TARGET"
            test $(stat -c%s "$TARGET") -gt 10000
            python3 - "$TARGET" <<'PY'
          import sys
          with open(sys.argv[1], 'rb') as f:
              assert f.read(3) == b'\xff\xd8\xff', "Not a JPEG"
          PY
          done < "$DIR/sources.txt"
          test "$COUNT" -eq 10
      - name: Save images to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add instagram/2026-11-15_android_unused_apps_10_cards/*.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Store 10 approved carousel images for November 15"
            git push
          fi
